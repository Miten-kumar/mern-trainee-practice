name: Complete CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      rollback:
        description: "Rollback to previous production image"
        required: false
        default: "false"
        type: boolean


env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}


jobs:

  # =========================================================
  # 1. TEST + LINT
  # Runs on Pull Requests and main
  # =========================================================

  test-and-lint:
    name: Test and Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Backend
      # -------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend build
        working-directory: backend
        run: npm run build


      # -------------------------
      # Frontend
      # -------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build


  # =========================================================
  # 2. BUILD DOCKER IMAGES
  # Only after main branch passes tests
  # =========================================================

  docker-build:
    name: Build Docker Images

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - test-and-lint

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # -------------------------
      # Login to GitHub Container Registry
      # -------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -------------------------
      # Build Backend
      # -------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest \
            ./backend


      # -------------------------
      # Build Frontend
      # -------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest \
            ./frontend


      # -------------------------
      # Push Backend
      # -------------------------

      - name: Push backend image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest


      # -------------------------
      # Push Frontend
      # -------------------------

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest


  # =========================================================
  # 3. DEPLOY TO STAGING
  # =========================================================

  deploy-staging:
    name: Deploy to Staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - docker-build

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Deploy application to staging
        run: |
          echo "Deploying backend to staging..."
          echo "Deploying frontend to staging..."
          echo "Image tag: ${{ github.sha }}"

          # Replace these commands with your actual
          # staging server deployment commands.

          echo "Staging deployment completed."


  # =========================================================
  # 4. STAGING SMOKE TEST
  # =========================================================

  smoke-test:
    name: Staging Smoke Test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - deploy-staging

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Check staging API
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          echo "Running smoke test..."

          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            "$STAGING_URL/api/v1/health"

          echo "Smoke test passed."


  # =========================================================
  # 5. PRODUCTION DEPLOYMENT
  # Requires GitHub Environment approval
  # =========================================================

  deploy-production:
    name: Deploy to Production

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.rollback != 'true'

    needs:
      - smoke-test

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Deploy production
        run: |
          echo "Production deployment started."

          echo "Deploying backend image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}"

          echo "Deploying frontend image:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}"

          # Replace these commands with your actual
          # production server deployment commands.

          echo "Production deployment completed."


  # =========================================================
  # 6. ROLLBACK
  # Manual workflow dispatch
  # =========================================================

  rollback:
    name: Production Rollback

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rollback == 'true'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Rollback production
        run: |
          echo "Starting production rollback..."

          # Replace this with the previous known-good
          # Docker image/tag.

          echo "Rolling backend back to previous version."
          echo "Rolling frontend back to previous version."

          echo "Rollback completed."