services:
  postgres:
    image: postgres:16-alpine
    container_name: cicd-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cicd_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d cicd_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cicd-backend

    environment:
      NODE_ENV: production
      PORT: 5000

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cicd_db?schema=public

      FRONTEND_URL: http://localhost:5173

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cicd-frontend

    environment:
      VITE_API_URL: http://localhost:5000/api/v1

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data: